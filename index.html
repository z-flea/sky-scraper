<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sky Scraper - 摩天大楼</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #score-display {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    #floor-count {
      position: absolute;
      top: 60px;
      left: 20px;
      color: white;
      font-size: 18px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    #game-over-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      justify-content: center;
      align-items: center;
      pointer-events: all;
    }

    #game-over-overlay.show {
      display: flex;
    }

    #game-over-panel {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    #game-over-title {
      font-size: 48px;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
    }

    #game-over-stats {
      font-size: 24px;
      color: #666;
      margin-bottom: 30px;
    }

    #restart-button {
      background: #4A90E2;
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s;
    }

    #restart-button:hover {
      background: #357ABD;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="ui-overlay">
    <div id="score-display">Score: 0</div>
    <div id="floor-count">Floor: 0</div>
  </div>

  <div id="game-over-overlay">
    <div id="game-over-panel">
      <div id="game-over-title">游戏结束</div>
      <div id="game-over-stats">
        <div>最终分数: <span id="final-score">0</span></div>
        <div>建造楼层: <span id="final-floors">0</span></div>
      </div>
      <button id="restart-button">重新开始</button>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
